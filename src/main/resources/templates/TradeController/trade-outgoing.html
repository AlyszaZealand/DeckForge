<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Outgoing Trades - DeckForge</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
<header th:replace="~{parts/header.html :: header}"></header>

<main class="container">
    <section class="auth-wrapper profile-wrapper">
        <div class="auth-box profile-box">

            <div th:if="${success != null}" class="alert alert-success mb-20">
                <p th:text="${success}"></p>
            </div>

            <a th:href="@{/trades}" class="btn btn-outline btn-sm mb-20">&larr; Tilbage til Dashboard</a>

            <header class="page-header" style="border-color: var(--text-gray); box-shadow: none;">
                <h1 style="margin: 0;">📤 Outgoing Proposals</h1>
            </header>

            <p th:if="${outgoingTrades.isEmpty()}" class="empty-text">You have no pending outgoing trades.</p>

            <section class="trade-list">
                <article th:each="trade : ${outgoingTrades}" class="trade-card default-border">
                    <header>
                        <h3>To: <span th:text="${trade.partnerUsername}">User</span></h3>
                        <p class="text-gray" style="font-size: 0.9rem;">
                            Date: <time th:text="${#temporals.format(trade.tradeDate, 'dd-MM-yyyy HH:mm')}">Date</time>
                        </p>
                        <span class="status-badge mb-20" th:text="${trade.tradeStatus}">Status</span>
                    </header>

                    <div class="trade-details">
                        <section class="trade-side">
                            <h4 style="color: var(--primary-red);">You Offer:</h4>
                            <ul>
                                <li th:each="item : ${trade.cardsYouGive}">
                                    🃏 <strong><span th:text="${item.totalQuantity} + 'x '"></span></strong>
                                    <span th:text="${item.card.cardName}"></span>
                                    <small th:text="'(' + ${item.card.cardSet} + ')'"></small>
                                </li>
                                <li th:if="${#lists.isEmpty(trade.cardsYouGive)}"><em>Nothing</em></li>
                            </ul>
                        </section>

                        <section class="trade-side">
                            <h4 style="color: #4caf50;">You Request:</h4>
                            <ul>
                                <li th:each="item : ${trade.cardsYouGet}">
                                    🃏 <strong><span th:text="${item.totalQuantity} + 'x '"></span></strong>
                                    <span th:text="${item.card.cardName}"></span>
                                    <small th:text="'(' + ${item.card.cardSet} + ')'"></small>
                                </li>
                                <li th:if="${#lists.isEmpty(trade.cardsYouGet)}"><em>Nothing</em></li>
                            </ul>
                        </section>
                    </div>

                    <footer class="trade-actions mt-20">
                        <form th:action="@{/cancel}" method="post">
                            <input type="hidden" name="redirectPath" value="/outgoing" />
                            <input type="hidden" name="tradeId" th:value="${trade.tradeId}" />
                            <button type="submit" class="btn btn-outline">Cancel Proposal</button>
                        </form>
                    </footer>
                </article>
            </section>

        </div>
    </section>
</main>

<footer th:replace="~{parts/footer.html :: footer}"></footer>
</body>
</html>
