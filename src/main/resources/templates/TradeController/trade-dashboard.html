<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Trade Dashboard - DeckForge</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

<section th:insert="~{parts/header.html :: header}"></section>

<main class="container">
    <div class="auth-wrapper" style="align-items: flex-start; padding-top: 40px;">
        <div class="auth-box" style="max-width: 1000px; width: 100%; padding: 40px;">

            <div style="border-bottom: 2px solid var(--primary-red); padding-bottom: 20px; margin-bottom: 30px;">
                <h1 style="color: var(--primary-red); margin: 0; text-shadow: var(--red-glow);">Trade Central</h1>
                <h2 style="color: var(--text-white); margin: 10px 0 0 0; font-size: 1.2rem;">Manage your card exchanges</h2>
            </div>

            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 40px;">
                <a th:href="@{/propose}" class="btn btn-primary" style="padding: 15px; font-size: 1rem; box-shadow: var(--red-glow);">
                    ➕ Propose New Trade
                </a>
                <a th:href="@{/incoming}" class="btn btn-outline" style="padding: 15px; font-size: 1rem; border-color: #4caf50; color: #4caf50;">
                    📥 Incoming Proposals
                </a>
                <a th:href="@{/outgoing}" class="btn btn-outline" style="padding: 15px; font-size: 1rem; border-color: var(--text-gray); color: var(--text-white);">
                    📤 Outgoing Proposals
                </a>
                <a th:href="@{/ongoing}" class="btn btn-outline" style="padding: 15px; font-size: 1rem;">
                    🤝 Ongoing Trades (IRL)
                </a>
            </div>

            <div>
                <h3 style="color: var(--text-gray); border-bottom: 1px solid var(--accent-gray); padding-bottom: 10px;">Trade History</h3>
                <p th:if="${tradeHistory.isEmpty()}" style="color: var(--text-gray); font-style: italic;">Your trade history is empty.</p>

                <div th:unless="${tradeHistory.isEmpty()}" class="scrollable-container" style="max-height: 400px; padding-right: 10px;">
                    <table style="width: 100%; border-collapse: collapse; margin-top: 5px; color: var(--text-white);">
                        <thead>
                        <tr style="border-bottom: 1px solid var(--accent-gray); text-align: left;">
                            <th style="padding: 10px; color: var(--primary-red);">Partner</th>
                            <th style="padding: 10px; color: var(--primary-red);">Status</th>
                            <th style="padding: 10px; text-align: right; color: var(--primary-red);">Date</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="trade : ${tradeHistory}" style="border-bottom: 1px solid rgba(255,255,255,0.05);">
                            <td style="padding: 15px 10px; font-weight: bold;" th:text="${trade.initiator.userID == currentUserId ? trade.receiver.username : trade.initiator.username}">Partner</td>
                            <td style="padding: 15px 10px;">
                                    <span th:text="${trade.tradeStatus}"
                                          th:style="${trade.tradeStatus.name() == 'COMPLETED'} ? 'color: #4caf50;' : 'color: var(--text-gray);'">Status</span>
                            </td>
                            <td style="padding: 15px 10px; text-align: right; color: var(--text-gray); font-size: 0.9rem;"
                                th:text="${trade.completedDate != null ? #temporals.format(trade.completedDate, 'dd-MM-yyyy HH:mm') : 'N/A'}">Date</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>
</main>

<section th:insert="~{parts/footer.html :: footer}"></section>

</body>
</html>
