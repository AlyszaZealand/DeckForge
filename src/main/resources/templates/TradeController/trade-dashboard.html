<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Trade Dashboard - DeckForge</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

<section th:insert="~{parts/header.html :: header}"></section>

<main class="container">
    <div class="auth-wrapper" style="align-items: flex-start; padding-top: 40px;">
        <div class="auth-box" style="max-width: 1000px; width: 100%; padding: 40px;">

            <div style="border-bottom: 2px solid var(--primary-red); padding-bottom: 20px; margin-bottom: 30px;">
                <h1 style="color: var(--primary-red); margin: 0; text-shadow: var(--red-glow);">Trade Central</h1>
                <h2 style="color: var(--text-white); margin: 10px 0 0 0; font-size: 1.2rem;">Manage your card exchanges</h2>
            </div>

            <div th:if="${incomingTradeCount > 0 or ongoingTradeCount > 0}" style="margin-bottom: 30px;">
                <h3 style="color: var(--text-white); border-bottom: 1px solid var(--accent-gray); padding-bottom: 10px; margin-bottom: 15px;">🔔 Action Required</h3>

                <div th:if="${incomingTradeCount > 0}" style="background-color: rgba(76, 175, 80, 0.1); border-left: 4px solid #4caf50; padding: 15px; margin-bottom: 10px; border-radius: 4px;">
                    <p style="margin: 0; color: #4caf50;">
                        📥 You have <strong th:text="${incomingTradeCount}"></strong> new trade proposal(s)!
                        <a th:href="@{/incoming}" style="color: white; text-decoration: underline; margin-left: 10px; font-size: 0.9rem;">View Incoming</a>
                    </p>
                </div>

                <div th:if="${ongoingTradeCount > 0}" style="background-color: rgba(255, 165, 0, 0.1); border-left: 4px solid orange; padding: 15px; margin-bottom: 10px; border-radius: 4px;">
                    <p style="margin: 0; color: orange;">
                        🤝 You have <strong th:text="${ongoingTradeCount}"></strong> trade(s) awaiting your action.
                        <a th:href="@{/ongoing}" style="color: white; text-decoration: underline; margin-left: 10px; font-size: 0.9rem;">View Ongoing</a>
                    </p>
                </div>
            </div>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 40px;">
                <a th:href="@{/propose}" class="btn btn-primary" style="padding: 15px; font-size: 1rem; box-shadow: var(--red-glow);">
                    ➕ Propose New Trade
                </a>
                <a th:href="@{/incoming}" class="btn btn-outline" style="padding: 15px; font-size: 1rem; border-color: #4caf50; color: #4caf50;">
                    📥 Incoming Proposals
                </a>
                <a th:href="@{/outgoing}" class="btn btn-outline" style="padding: 15px; font-size: 1rem; border-color: var(--text-gray); color: var(--text-white);">
                    📤 Outgoing Proposals
                </a>
                <a th:href="@{/ongoing}" class="btn btn-outline" style="padding: 15px; font-size: 1rem;">
                    🤝 Ongoing Trades (IRL)
                </a>
            </div>

        </div>
    </div>
</main>

<section th:insert="~{parts/footer.html :: footer}"></section>

</body>
</html>
