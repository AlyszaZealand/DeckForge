<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Trade Dashboard - DeckForge</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

<header th:replace="~{parts/header.html :: header}"></header>

<main class="container">
    <section class="auth-wrapper profile-wrapper">
        <article class="auth-box profile-box" style="max-width: 1000px;">

            <header class="page-header">
                <h1 style="color: var(--primary-red); margin: 0; text-shadow: var(--red-glow);">Trade Central</h1>
                <h2 style="color: var(--text-white); margin: 10px 0 0 0; font-size: 1.2rem;">Manage your card exchanges</h2>
            </header>

            <section th:if="${incomingTradeCount > 0 or ongoingTradeCount > 0}" class="dashboard-highlight">
                <h3 style="border-bottom: 1px solid var(--accent-gray); padding-bottom: 10px; margin-bottom: 15px;">🔔 Action Required</h3>

                <div th:if="${incomingTradeCount > 0}" class="alert alert-success">
                    <p>
                        📥 You have <strong th:text="${incomingTradeCount}"></strong> new trade proposal(s)!
                        <a th:href="@{/incoming}">View Incoming</a>
                    </p>
                </div>

                <div th:if="${ongoingTradeCount > 0}" class="alert alert-warning">
                    <p>
                        🤝 You have <strong th:text="${ongoingTradeCount}"></strong> trade(s) awaiting your action.
                        <a th:href="@{/ongoing}">View Ongoing</a>
                    </p>
                </div>
            </section>

            <nav class="dashboard-grid">
                <a th:href="@{/propose}" class="btn btn-primary" style="box-shadow: var(--red-glow); padding: 15px;">
                    ➕ Propose New Trade
                </a>
                <a th:href="@{/incoming}" class="btn btn-outline btn-success" style="padding: 15px;">
                    📥 Incoming Proposals
                </a>
                <a th:href="@{/outgoing}" class="btn btn-outline" style="border-color: var(--text-gray); color: var(--text-white); padding: 15px;">
                    📤 Outgoing Proposals
                </a>
                <a th:href="@{/ongoing}" class="btn btn-outline" style="padding: 15px;">
                    🤝 Ongoing Trades (IRL)
                </a>
            </nav>

        </article>
    </section>
</main>

<footer th:replace="~{parts/footer.html :: footer}"></footer>

</body>
</html>
