<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Trade History - DeckForge</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
<header th:replace="~{parts/header.html :: header}"></header>

<main class="container">
    <section class="auth-wrapper profile-wrapper">
        <div class="auth-box profile-box">

            <a th:href="@{/trades}" class="btn btn-outline btn-sm mb-20">&larr; Tilbage til Dashboard</a>

            <header class="page-header" style="display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 15px;">
                <h1 style="margin: 0;">📜 Trade History</h1>
                <form th:action="@{/trade_history}" method="get" style="margin: 0;">
                    <label for="sort" class="text-gray" style="font-size: 0.9rem; margin-right: 5px;">Sort by:</label>
                    <select name="sort" id="sort" onchange="this.form.submit()" class="form-control" style="width: auto; display: inline-block; padding: 5px;">
                        <option value="desc" th:selected="${currentSort == 'desc'}">Newest First</option>
                        <option value="asc" th:selected="${currentSort == 'asc'}">Oldest First</option>
                    </select>
                </form>
            </header>

            <p th:if="${tradeHistory.isEmpty()}" class="empty-text">Your trade history is empty.</p>

            <section class="trade-list">
                <article th:each="trade : ${tradeHistory}" class="trade-card">
                    <header>
                        <h3>Partner: <span th:text="${trade.partnerUsername}">Partner</span></h3>
                        <p class="font-bold"
                           th:styleappend="${trade.tradeStatus.name() == 'COMPLETED'} ? 'color: #4caf50;' : 'color: var(--primary-red);'"
                           th:text="${trade.tradeStatus}">Status</p>
                        <p class="text-gray" style="font-size: 0.9rem;">
                            Proposed: <time th:text="${#temporals.format(trade.tradeDate, 'dd-MM-yyyy HH:mm')}">Date</time>
                        </p>
                    </header>

                    <div class="trade-details">
                        <section class="trade-side">
                            <h4 style="color: var(--primary-red);">You Offered:</h4>
                            <ul>
                                <li th:each="item : ${trade.cardsYouGive}">
                                    🃏 <strong><span th:text="${item.totalQuantity} + 'x '"></span></strong>
                                    <span th:text="${item.card.cardName}"></span>
                                    <small th:text="'(' + ${item.card.cardSet} + ')'"></small>
                                </li>
                                <li th:if="${#lists.isEmpty(trade.cardsYouGive)}"><em>Nothing</em></li>
                            </ul>
                        </section>

                        <section class="trade-side">
                            <h4 style="color: #4caf50;">You Wanted:</h4>
                            <ul>
                                <li th:each="item : ${trade.cardsYouGet}">
                                    🃏 <strong><span th:text="${item.totalQuantity} + 'x '"></span></strong>
                                    <span th:text="${item.card.cardName}"></span>
                                    <small th:text="'(' + ${item.card.cardSet} + ')'"></small>
                                </li>
                                <li th:if="${#lists.isEmpty(trade.cardsYouGet)}"><em>Nothing</em></li>
                            </ul>
                        </section>
                    </div>
                </article>
            </section>

        </div>
    </section>
</main>

<footer th:replace="~{parts/footer.html :: footer}"></footer>
</body>
</html>
