<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Incoming Trades - DeckForge</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
<header th:replace="~{parts/header.html :: header}"></header>

<main class="container">
    <section class="auth-wrapper profile-wrapper">
        <div class="auth-box profile-box">

            <a th:href="@{/trades}" class="btn btn-outline btn-sm mb-20">&larr; Tilbage til Dashboard</a>

            <header class="page-header" style="border-color: #4caf50; box-shadow: 0 4px 10px -5px #4caf50;">
                <h1 style="color: #4caf50; margin: 0;">📥 Incoming Proposals</h1>
            </header>

            <p th:if="${incomingTrades.isEmpty()}" class="empty-text">You have no incoming trade requests.</p>

            <section class="trade-list">
                <article th:each="trade : ${incomingTrades}" class="trade-card success-border">
                    <header>
                        <h3>From: <span th:text="${trade.partnerUsername}">User</span></h3>
                        <p class="text-gray mb-20" style="font-size: 0.9rem;">
                            Proposed: <time th:text="${#temporals.format(trade.tradeDate, 'dd-MM-yyyy HH:mm')}">Date</time>
                        </p>
                    </header>

                    <div class="trade-details">
                        <section class="trade-side">
                            <h4 style="color: var(--primary-red);">You Give:</h4>
                            <ul>
                                <li th:each="item : ${trade.cardsYouGive}">
                                    🃏 <strong><span th:text="${item.totalQuantity} + 'x '"></span></strong>
                                    <span th:text="${item.card.cardName}"></span>
                                    <small th:text="'(' + ${item.card.cardSet} + ')'"></small>
                                </li>
                                <li th:if="${#lists.isEmpty(trade.cardsYouGive)}"><em>Nothing</em></li>
                            </ul>
                        </section>

                        <section class="trade-side">
                            <h4 style="color: #4caf50;">You Get:</h4>
                            <ul>
                                <li th:each="item : ${trade.cardsYouGet}">
                                    🃏 <strong><span th:text="${item.totalQuantity} + 'x '"></span></strong>
                                    <span th:text="${item.card.cardName}"></span>
                                    <small th:text="'(' + ${item.card.cardSet} + ')'"></small>
                                </li>
                                <li th:if="${#lists.isEmpty(trade.cardsYouGet)}"><em>Nothing</em></li>
                            </ul>
                        </section>
                    </div>

                    <footer class="trade-actions mt-20">
                        <form th:action="@{/respond}" method="post">
                            <input type="hidden" name="redirectPath" value="/incoming" />
                            <input type="hidden" name="tradeId" th:value="${trade.tradeId}" />

                            <button type="submit" name="isAccepted" value="true" class="btn btn-outline btn-success">Accept Trade</button>
                            <button type="submit" name="isAccepted" value="false" class="btn btn-danger">Decline Trade</button>
                        </form>
                    </footer>
                </article>
            </section>

        </div>
    </section>
</main>

<footer th:replace="~{parts/footer.html :: footer}"></footer>
</body>
</html>
