<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Incoming Trades - DeckForge</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
</head>
<body>
<section th:insert="~{parts/header.html :: header}"></section>

<main class="container">
    <div class="auth-wrapper" style="align-items: flex-start; padding-top: 40px;">
        <div class="auth-box" style="max-width: 800px; width: 100%; padding: 40px;">

            <a th:href="@{/trades}" class="btn btn-outline" style="font-size: 0.8rem; margin-bottom: 20px;">&larr; Tilbage til Dashboard</a>

            <h1 style="color: #4caf50; border-bottom: 1px solid #4caf50; padding-bottom: 10px; margin-bottom: 20px;">📥 Incoming Proposals</h1>

            <p th:if="${incomingTrades.isEmpty()}" style="color: var(--text-gray); font-style: italic;">You have no incoming trade requests.</p>

            <div th:each="trade : ${incomingTrades}" style="background: var(--bg-darkest); padding: 20px; margin-bottom: 15px; border-left: 4px solid #4caf50; border-radius: 4px;">
                <h3 style="margin: 0 0 10px 0; color: white;">From: <span th:text="${trade.partnerUsername}">User</span></h3>

                <p style="margin: 0 0 20px 0; font-size: 0.9rem; color: var(--text-gray);">
                    Proposed: <span th:text="${#temporals.format(trade.tradeDate, 'dd-MM-yyyy HH:mm')}">Date</span>
                </p>

                <div style="display: flex; gap: 20px; margin-bottom: 20px;">
                    <div style="flex: 1; background: rgba(255,255,255,0.05); padding: 15px; border-radius: 4px;">
                        <h4 style="color: var(--primary-red); margin-top: 0; margin-bottom: 10px;">You Give:</h4>
                        <ul style="list-style: none; padding: 0; margin: 0; color: var(--text-gray); font-size: 0.9rem;">
                            <li th:each="item : ${trade.cardsYouGive}" style="margin-bottom: 5px;">
                                🃏 <span th:text="${item.totalQuantity} + 'x '" style="color: white; font-weight: bold;"></span>
                                <span th:text="${item.card.cardName}" style="color: white;"></span>
                                <span style="font-size: 0.8rem; opacity: 0.7;" th:text="'(' + ${item.card.cardSet} + ')'"></span>
                            </li>
                            <li th:if="${#lists.isEmpty(trade.cardsYouGive)}"><em>Nothing</em></li>
                        </ul>
                    </div>

                    <div style="flex: 1; background: rgba(255,255,255,0.05); padding: 15px; border-radius: 4px;">
                        <h4 style="color: #4caf50; margin-top: 0; margin-bottom: 10px;">You Get:</h4>
                        <ul style="list-style: none; padding: 0; margin: 0; color: var(--text-gray); font-size: 0.9rem;">
                            <li th:each="item : ${trade.cardsYouGet}" style="margin-bottom: 5px;">
                                🃏 <span th:text="${item.totalQuantity} + 'x '" style="color: white; font-weight: bold;"></span>
                                <span th:text="${item.card.cardName}" style="color: white;"></span>
                                <span style="font-size: 0.8rem; opacity: 0.7;" th:text="'(' + ${item.card.cardSet} + ')'"></span>
                            </li>
                            <li th:if="${#lists.isEmpty(trade.cardsYouGet)}"><em>Nothing</em></li>
                        </ul>
                    </div>
                </div>

                <form th:action="@{/respond}" method="post" style="display: flex; gap: 15px; margin: 0;">
                    <input type="hidden" name="redirectPath" value="/incoming" />
                    <input type="hidden" name="tradeId" th:value="${trade.tradeId}" />

                    <button type="submit" name="isAccepted" value="true" class="btn btn-outline" style="border-color: #4caf50; color: #4caf50;">Accept Trade</button>
                    <button type="submit" name="isAccepted" value="false" class="btn btn-danger">Decline Trade</button>
                </form>
            </div>

        </div>
    </div>
</main>

<section th:insert="~{parts/footer.html :: footer}"></section>
</body>
</html>
