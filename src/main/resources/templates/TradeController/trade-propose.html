<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Propose Trade - DeckForge</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">

    <style>
        .card-selection-box {
            background-color: var(--bg-darkest);
            border: 1px solid var(--accent-gray);
            border-radius: 4px;
            padding: 10px;
            max-height: 200px;
            overflow-y: auto;
        }
        .card-checkbox-item {
            display: block;
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .card-checkbox-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }
    </style>
</head>
<body>
<section th:insert="~{parts/header.html :: header}"></section>

<main class="container">
    <div class="auth-wrapper" style="align-items: flex-start; padding-top: 40px;">
        <div class="auth-box" style="max-width: 800px; width: 100%; padding: 40px;">

            <div th:if="${errorMessage != null}" style="background-color: rgba(255,0,0,0.1); border-left: 4px solid #ff4444; padding: 15px; margin-bottom: 20px;">
                <p th:text="${errorMessage}" style="color: #ff4444; margin: 0; font-weight: bold;"></p>
            </div>

            <a th:href="@{/trades}" class="btn btn-outline" style="font-size: 0.8rem; margin-bottom: 20px;">&larr; Back to Dashboard</a>

            <h1 style="color: var(--primary-red); border-bottom: 1px solid var(--border-red); padding-bottom: 10px; margin-bottom: 20px; text-shadow: var(--red-glow);">➕ Propose New Trade</h1>

            <p style="color: var(--text-gray); margin-bottom: 30px;">Select a user and the cards you wish to exchange.</p>

            <form th:action="@{/propose}" th:object="${newTrade}" method="post">

                <div class="form-group">
                    <label>Select Trade Partner</label>
                    <select name="receiverId" class="form-control" required>
                        <option value="" disabled selected>-- Choose a User --</option>
                        <option th:each="user : ${allOtherUsers}"
                                th:value="${user.userID}"
                                th:text="${user.username}"></option>
                    </select>
                </div>

                <div style="display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap;">

                    <div class="form-group" style="flex: 1; min-width: 300px;">
                        <label>Cards You Offer</label>
                        <div class="card-selection-box scrollable-container">
                            <p th:if="${myTradeCollection == null or myTradeCollection.tradeCollectionItems.isEmpty()}" style="color: var(--text-gray); font-style: italic; font-size: 0.9rem;">
                                Your trade collection is empty.
                            </p>

                            <th:block th:if="${myTradeCollection != null}">
                                <label th:each="item : ${myTradeCollection.tradeCollectionItems}" class="card-checkbox-item">
                                    <input type="checkbox" name="offeredCardIds" th:value="${item.card.cardID}">
                                    <span th:text="${item.card.cardName}" style="color: white; margin-left: 5px;">Card Name</span>
                                    <span th:text="'(x' + ${item.quantity} + ')'" style="color: var(--text-gray); font-size: 0.8rem;">(x1)</span>
                                </label>
                            </th:block>
                        </div>
                    </div>

                    <div class="form-group" style="flex: 1; min-width: 300px;">
                        <label>Cards You Request</label>
                        <div class="card-selection-box scrollable-container">
                            <p style="color: var(--text-gray); font-style: italic; font-size: 0.9rem;">
                                Select a partner to see their available cards...
                            </p>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Send Proposal</button>
            </form>

        </div>
    </div>
</main>

<section th:insert="~{parts/footer.html :: footer}"></section>
</body>
</html>
