<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Ongoing Trades - DeckForge</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
<header th:replace="~{parts/header.html :: header}"></header>

<main class="container">
    <section class="auth-wrapper profile-wrapper">
        <div class="auth-box profile-box">

            <a th:href="@{/trades}" class="btn btn-outline btn-sm mb-20">&larr; Tilbage til Dashboard</a>

            <header class="page-header">
                <h1 style="color: var(--primary-red); margin: 0; text-shadow: var(--red-glow);">🤝 Ongoing Trades (IRL)</h1>
            </header>

            <p th:if="${ongoingTrades.isEmpty()}" class="empty-text">No ongoing trades at the moment.</p>

            <section class="trade-list">
                <article th:each="trade : ${ongoingTrades}" class="trade-card">
                    <header>
                        <h3>Partner: <span th:text="${trade.partnerUsername}">Partner</span></h3>
                        <p class="text-gray" style="font-size: 0.9rem;">
                            Proposed: <time th:text="${#temporals.format(trade.tradeDate, 'dd-MM-yyyy HH:mm')}">Date</time>
                        </p>
                        <p class="font-bold mb-20" style="color: var(--primary-red); font-size: 1rem;" th:text="${trade.tradeStatus}">Status</p>
                    </header>

                    <div class="trade-details">
                        <section class="trade-side">
                            <h4 style="color: var(--primary-red);">You Give:</h4>
                            <ul>
                                <li th:each="item : ${trade.cardsYouGive}">
                                    🃏 <strong><span th:text="${item.totalQuantity} + 'x '"></span></strong>
                                    <span th:text="${item.card.cardName}"></span>
                                    <small th:text="'(' + ${item.card.cardSet} + ')'"></small>
                                </li>
                                <li th:if="${#lists.isEmpty(trade.cardsYouGive)}"><em>Nothing</em></li>
                            </ul>
                        </section>

                        <section class="trade-side">
                            <h4 style="color: #4caf50;">You Get:</h4>
                            <ul>
                                <li th:each="item : ${trade.cardsYouGet}">
                                    🃏 <strong><span th:text="${item.totalQuantity} + 'x '"></span></strong>
                                    <span th:text="${item.card.cardName}"></span>
                                    <small th:text="'(' + ${item.card.cardSet} + ')'"></small>
                                </li>
                                <li th:if="${#lists.isEmpty(trade.cardsYouGet)}"><em>Nothing</em></li>
                            </ul>
                        </section>
                    </div>

                    <footer class="trade-actions mt-20">
                        <form th:action="@{/finalize}" method="post" style="flex: 1; min-width: 200px;">
                            <input type="hidden" name="redirectPath" value="/ongoing" />
                            <input type="hidden" name="tradeId" th:value="${trade.tradeId}" />

                            <button th:if="${trade.requiresYourConfirmation}" type="submit" class="btn btn-primary btn-block">
                                Confirm IRL Trade Completed
                            </button>

                            <div th:if="${trade.waitingForPartnerConfirmation}" class="waiting-box">
                                <p>Waiting for partner to confirm...</p>
                            </div>
                        </form>

                        <form th:action="@{/cancel}" method="post">
                            <input type="hidden" name="redirectPath" value="/ongoing" />
                            <input type="hidden" name="tradeId" th:value="${trade.tradeId}" />
                            <button type="submit" class="btn btn-danger" style="height: 100%;">Cancel Trade</button>
                        </form>
                    </footer>
                </article>
            </section>

        </div>
    </section>
</main>

<footer th:replace="~{parts/footer.html :: footer}"></footer>
</body>
</html>
