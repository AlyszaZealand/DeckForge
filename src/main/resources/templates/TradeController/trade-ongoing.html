<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Ongoing Trades - DeckForge</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
</head>
<body>
<section th:insert="~{parts/header.html :: header}"></section>

<main class="container">
    <div class="auth-wrapper" style="align-items: flex-start; padding-top: 40px;">
        <div class="auth-box" style="max-width: 800px; width: 100%; padding: 40px;">

            <a th:href="@{/trades}" class="btn btn-outline" style="font-size: 0.8rem; margin-bottom: 20px;">&larr; Back to Dashboard</a>

            <h1 style="color: var(--primary-red); border-bottom: 1px solid var(--border-red); padding-bottom: 10px; margin-bottom: 20px; text-shadow: var(--red-glow);">🤝 Ongoing Trades (IRL)</h1>

            <p th:if="${ongoingTrades.isEmpty()}" style="color: var(--text-gray); font-style: italic;">No ongoing trades at the moment.</p>

            <div th:each="trade : ${ongoingTrades}" style="background: var(--bg-darkest); padding: 20px; margin-bottom: 15px; border-left: 4px solid var(--primary-red); border-radius: 4px;">
                <h3 style="margin: 0 0 5px 0; color: white;">Partner: <span th:text="${trade.partnerUsername}">Partner</span></h3>

                <p style="margin: 0 0 10px 0; font-size: 0.9rem; color: var(--text-gray);">
                    Proposed: <span th:text="${#temporals.format(trade.tradeDate, 'dd-MM-yyyy HH:mm')}">Date</span>
                </p>

                <p style="margin: 0 0 20px 0; font-size: 1rem; color: var(--primary-red); font-weight: bold;" th:text="${trade.tradeStatus}">Status</p>

                <div style="display: flex; gap: 20px; margin-bottom: 20px;">
                    <div style="flex: 1; background: rgba(255,255,255,0.05); padding: 15px; border-radius: 4px;">
                        <h4 style="color: var(--primary-red); margin-top: 0; margin-bottom: 10px;">You Give:</h4>
                        <ul style="list-style: none; padding: 0; margin: 0; color: var(--text-gray); font-size: 0.9rem;">
                            <li th:each="item : ${trade.cardsYouGive}" style="margin-bottom: 5px;">
                                🃏 <span th:text="${item.totalQuantity} + 'x '" style="color: white; font-weight: bold;"></span>
                                <span th:text="${item.card.cardName}" style="color: white;"></span>
                                <span style="font-size: 0.8rem; opacity: 0.7;" th:text="'(' + ${item.card.cardSet} + ')'"></span>
                            </li>
                            <li th:if="${#lists.isEmpty(trade.cardsYouGive)}"><em>Nothing</em></li>
                        </ul>
                    </div>

                    <div style="flex: 1; background: rgba(255,255,255,0.05); padding: 15px; border-radius: 4px;">
                        <h4 style="color: #4caf50; margin-top: 0; margin-bottom: 10px;">You Get:</h4>
                        <ul style="list-style: none; padding: 0; margin: 0; color: var(--text-gray); font-size: 0.9rem;">
                            <li th:each="item : ${trade.cardsYouGet}" style="margin-bottom: 5px;">
                                🃏 <span th:text="${item.totalQuantity} + 'x '" style="color: white; font-weight: bold;"></span>
                                <span th:text="${item.card.cardName}" style="color: white;"></span>
                                <span style="font-size: 0.8rem; opacity: 0.7;" th:text="'(' + ${item.card.cardSet} + ')'"></span>
                            </li>
                            <li th:if="${#lists.isEmpty(trade.cardsYouGet)}"><em>Nothing</em></li>
                        </ul>
                    </div>
                </div>

                <div style="display: flex; gap: 15px; flex-wrap: wrap;">
                    <form th:action="@{/finalize}" method="post" style="margin: 0; flex: 1;">
                        <input type="hidden" name="redirectPath" value="/ongoing" />
                        <input type="hidden" name="tradeId" th:value="${trade.tradeId}" />

                        <div th:if="${trade.requiresYourConfirmation}">
                            <button type="submit" class="btn btn-primary" style="width: 100%;">Confirm IRL Trade Completed</button>
                        </div>

                        <div th:if="${trade.waitingForPartnerConfirmation}" style="background: rgba(255,255,255,0.05); padding: 10px; text-align: center; border-radius: 4px; height: 100%; display: flex; align-items: center; justify-content: center;">
                            <p style="margin: 0; color: var(--text-gray); font-size: 0.9rem; font-style: italic;">Waiting for partner to confirm...</p>
                        </div>
                    </form>

                    <form th:action="@{/cancel}" method="post" style="margin: 0;">
                        <input type="hidden" name="redirectPath" value="/ongoing" />
                        <input type="hidden" name="tradeId" th:value="${trade.tradeId}" />
                        <button type="submit" class="btn btn-danger" style="height: 100%;">Cancel Trade</button>
                    </form>
                </div>
            </div>

        </div>
    </div>
</main>

<section th:insert="~{parts/footer.html :: footer}"></section>
</body>
</html>
