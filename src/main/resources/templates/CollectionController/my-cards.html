<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Min Samling</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
    <meta charset="UTF-8">
</head>
<body>

<main>
    <section th:insert="~{Parts/header.html :: header}"></section>

    <h1>Min Samling</h1>

    <div th:if="${errorMessage != null}">
        <p th:text="${errorMessage}" style="color: red;"></p>
    </div>

    <div class="filter-menu">
        <form th:action="@{/myCards}" method="get">

            <div class="radio-toggles">
                <label>
                    <input type="radio" name="searchCatalog" value="true" th:checked="${searchCatalog}">
                    Søg i Katalog (Find nye kort)
                </label>
                <label>
                    <input type="radio" name="searchCatalog" value="false" th:checked="${!searchCatalog}">
                    Filtrér min samling
                </label>
            </div>

            <br>

            <input type="text" name="cardName" placeholder="Søg på kortnavn...">

            <select name="rarity">
                <option value="">Alle Sjældenheder</option>
                <option value="COMMON">Common</option>
                <option value="UNCOMMON">Uncommon</option>
                <option value="RARE">Rare</option>
                <option value="MYTHICRARE">Mythic Rare</option>
            </select>

            <select name="color">
                <option value="">Alle Farver</option>
                <option value="W">Hvid (W)</option>
                <option value="U">Blå (U)</option>
                <option value="B">Sort (B)</option>
                <option value="R">Rød (R)</option>
                <option value="G">Grøn (G)</option>
                <option value="C">Farveløs (C)</option>
            </select>

            <button type="submit">Udfør</button>
            <a th:href="@{/myCards}">Nulstil</a>
        </form>
    </div>

    <hr>

    <div th:if="${searchCatalog}">
        <h2>Resultater fra Kataloget</h2>

        <div th:if="${catalogResults != null and not #lists.isEmpty(catalogResults)}">
            <ul>
                <li th:each="card : ${catalogResults}">
                    <strong th:text="${card.cardName}">Kortnavn</strong>
                    - Farve: <span th:text="${card.colorIdentity != '' ? card.colorIdentity : 'Farveløs'}"></span>,
                    Sjældenhed: <span th:text="${card.cardRarity}"></span>

                    <form th:action="@{/addCardToCollection}" method="post">
                        <input type="hidden" name="cardID" th:value="${card.cardID}" />
                        <button type="submit">Tilføj til samling</button>
                    </form>
                </li>
            </ul>
        </div>
        <div th:if="${catalogResults == null or #lists.isEmpty(catalogResults)}">
            <p>Ingen kort fundet i kataloget.</p>
        </div>
    </div>

    <div th:if="${!searchCatalog}">
        <h2>Kort i din samling</h2>

        <div th:if="${collection != null and not #lists.isEmpty(collection.collectionItems)}">
            <ul>
                <li th:each="item : ${collection.collectionItems}">
                    <strong th:text="${item.card.cardName}">Kortnavn</strong>
                    (Antal: <span th:text="${item.quantity}"></span>)
                    - Farve: <span th:text="${item.card.colorIdentity != '' ? item.card.colorIdentity : 'Farveløs'}"></span>,
                    Sjældenhed: <span th:text="${item.card.cardRarity}"></span>

                    <form th:action="@{/removeCardFromCollection}" method="post">
                        <input type="hidden" name="cardID" th:value="${item.card.cardID}" />
                        <button type="submit">Fjern</button>
                    </form>
                </li>
            </ul>
        </div>
        <div th:if="${collection == null or #lists.isEmpty(collection.collectionItems)}">
            <p>Ingen kort i samlingen matcher din søgning, eller din samling er tom.</p>
        </div>
    </div>

    <section th:insert="~{Parts/footer.html :: footer}"></section>
</main>
</body>
</html>
