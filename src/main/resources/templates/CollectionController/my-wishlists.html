<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Min Ønskeliste</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
    <meta charset="UTF-8">
</head>
<body>

<main>
    <section th:insert="~{Parts/header.html :: header}"></section>

    <h1>Min Ønskeliste</h1>

    <div th:if="${errorMessage != null}">
        <p th:text="${errorMessage}" style="color: red;"></p>
    </div>

    <div class="filter-menu">
        <form th:action="@{/myWishCollection}" method="get">
            <input type="text" name="cardName" placeholder="Søg i katalog efter nye ønsker...">

            <select name="rarity">
                <option value="">Alle Sjældenheder</option>
                <option value="COMMON">Common</option>
                <option value="UNCOMMON">Uncommon</option>
                <option value="RARE">Rare</option>
                <option value="MYTHICRARE">Mythic Rare</option>
            </select>

            <select name="color">
                <option value="">Alle Farver</option>
                <option value="W">Hvid (W)</option>
                <option value="U">Blå (U)</option>
                <option value="B">Sort (B)</option>
                <option value="R">Rød (R)</option>
                <option value="G">Grøn (G)</option>
                <option value="C">Farveløs (C)</option>
            </select>

            <button type="submit">Søg</button>
            <a th:href="@{/myWishCollection}">Ryd Søgning</a>
        </form>
    </div>

    <hr>

    <div th:if="${catalogResults != null}">
        <h2>Søgeresultater</h2>
        <div th:if="${not #lists.isEmpty(catalogResults)}">
            <ul>
                <li th:each="card : ${catalogResults}">
                    <strong th:text="${card.cardName}">Kortnavn</strong>
                    - Farve: <span th:text="${card.colorIdentity != '' ? card.colorIdentity : 'Farveløs'}"></span>,
                    Sjældenhed: <span th:text="${card.cardRarity}"></span>

                    <form th:action="@{/addCardToWishList}" method="post">
                        <input type="hidden" name="cardID" th:value="${card.cardID}" />
                        <button type="submit">Tilføj til ønskeliste</button>
                    </form>
                </li>
            </ul>
        </div>
        <div th:if="${#lists.isEmpty(catalogResults)}">
            <p>Ingen kort fundet i kataloget.</p>
        </div>
        <hr>
    </div>

    <h2>Dine nuværende ønsker</h2>

    <div th:if="${wishCollection != null and not #lists.isEmpty(wishCollection.wishCollectionItems)}">
        <ul>
            <li th:each="item : ${wishCollection.wishCollectionItems}">
                <strong th:text="${item.card.cardName}">Kortnavn</strong>
                - Farve: <span th:text="${item.card.colorIdentity != '' ? item.card.colorIdentity : 'Farveløs'}"></span>,
                Sjældenhed: <span th:text="${item.card.cardRarity}"></span>

                <form th:action="@{/removeCardFromWishList}" method="post">
                    <input type="hidden" name="cardID" th:value="${item.card.cardID}" />
                    <button type="submit">Fjern</button>
                </form>
            </li>
        </ul>
    </div>
    <div th:if="${wishCollection == null or #lists.isEmpty(wishCollection.wishCollectionItems)}">
        <p>Din ønskeliste er tom!</p>
    </div>

    <section th:insert="~{Parts/footer.html :: footer}"></section>
</main>
</body>
</html>
