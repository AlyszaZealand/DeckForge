<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Min Bytteliste</title>
  <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
  <meta charset="UTF-8">
</head>
<body>

<main>
  <section th:insert="~{Parts/header.html :: header}"></section>

  <h1>Min Bytteliste</h1>

  <div th:if="${errorMessage != null}">
    <p th:text="${errorMessage}" style="color: red;"></p>
  </div>

  <div class="filter-menu">
    <form th:action="@{/myTradeList}" method="get">
      <input type="text" name="cardName" placeholder="Filtrér i din bytteliste...">

      <select name="rarity">
        <option value="">Alle Sjældenheder</option>
        <option value="COMMON">Common</option>
        <option value="UNCOMMON">Uncommon</option>
        <option value="RARE">Rare</option>
        <option value="MYTHICRARE">Mythic Rare</option>
      </select>

      <select name="color">
        <option value="">Alle Farver</option>
        <option value="W">Hvid (W)</option>
        <option value="U">Blå (U)</option>
        <option value="B">Sort (B)</option>
        <option value="R">Rød (R)</option>
        <option value="G">Grøn (G)</option>
        <option value="C">Farveløs (C)</option>
      </select>

      <button type="submit" style="background-color: #2c3e50; color: white; padding: 5px 15px; cursor: pointer;">Søg</button>
      <a th:href="@{/myTradeList}" style="margin-left: 10px;">Nulstil</a>
    </form>
  </div>

  <hr>

  <h2>Dine byttekort</h2>
  <div th:if="${tradeCollection != null and not #lists.isEmpty(tradeCollection.tradeCollectionItems)}">
    <li th:each="item : ${tradeCollection.tradeCollectionItems}">
      <strong th:text="${item.card.cardName}">Kortnavn</strong>
      - Farve: <span th:text="${item.card.colorIdentity != '' ? item.card.colorIdentity : 'Farveløs'}"></span>,
      Sjældenhed: <span th:text="${item.card.cardRarity}"></span>

      <div style="display: flex; gap: 10px; align-items: center; margin-top: 5px;">

        <form th:action="@{/decreaseTradeCardQuantity}" method="post">
          <input type="hidden" name="cardID" th:value="${item.card.cardID}" />
          <input type="hidden" name="cardName" th:value="${param.cardName}" />
          <input type="hidden" name="rarity" th:value="${param.rarity}" />
          <input type="hidden" name="color" th:value="${param.color}" />
          <button type="submit">-</button>
        </form>

        <span>Antal: <strong th:text="${item.quantity}"></strong></span>

        <form th:action="@{/addCardToTradeList}" method="post">
          <input type="hidden" name="cardID" th:value="${item.card.cardID}" />
          <input type="hidden" name="cardName" th:value="${param.cardName}" />
          <input type="hidden" name="rarity" th:value="${param.rarity}" />
          <input type="hidden" name="color" th:value="${param.color}" />
          <button type="submit">+</button>
        </form>

        <form th:action="@{/removeCardFromTradeList}" method="post" style="margin-left: 15px;">
          <input type="hidden" name="cardID" th:value="${item.card.cardID}" />
          <input type="hidden" name="cardName" th:value="${param.cardName}" />
          <input type="hidden" name="rarity" th:value="${param.rarity}" />
          <input type="hidden" name="color" th:value="${param.color}" />
          <button type="submit" style="background-color: #e74c3c; color: white;">Fjern helt</button>
        </form>
      </div>
    </li>
  </div>

  <div th:if="${tradeCollection == null or #lists.isEmpty(tradeCollection.tradeCollectionItems)}">
    <p>Du har ingen kort på din bytteliste, eller ingen kort matcher dit filter.</p>
  </div>

  <section th:insert="~{Parts/footer.html :: footer}"></section>
</main>
</body>
</html>
