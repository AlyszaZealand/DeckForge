<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${profileUser.username} + 's Decks - DeckForge'">Decks</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

<header th:replace="~{Parts/header :: header}"></header>

<main class="container">
    <section class="auth-wrapper profile-wrapper">
        <div class="auth-box profile-box">

            <header class="profile-header">
                <h1 style="margin: 0; color: var(--text-white);"><span th:text="${profileUser.username}">Bruger</span>'s Decks</h1>
                <a th:href="@{/profile/{id}(id=${profileUser.userID})}" class="btn btn-outline btn-sm">Tilbage til Profil</a>
            </header>

            <div th:if="${#lists.isEmpty(decks)}" class="empty-state">
                <p class="empty-text">Denne bruger har ikke oprettet nogen decks endnu.</p>
            </div>

            <section th:unless="${#lists.isEmpty(decks)}" style="display: flex; flex-direction: column; gap: 15px;">

                <a th:each="deck : ${decks}" th:href="@{/public-deck/{deckId}(deckId=${deck.deckID})}" style="text-decoration: none;">
                    <article class="event-card card-primary" style="display: flex; justify-content: space-between; align-items: center; transition: 0.3s;">

                        <div>
                            <h3 th:text="${deck.deckName}" style="color: var(--text-white); margin: 0 0 5px 0;">Deck Navn</h3>
                        </div>

                        <div>
                            <span class="text-gray" style="font-size: 0.9rem; font-style: italic;">Offentligt Deck &rarr;</span>
                        </div>

                    </article>
                </a>

            </section>

        </div>
    </section>
</main>

<footer th:replace="~{Parts/footer :: footer}"></footer>

</body>
</html>
