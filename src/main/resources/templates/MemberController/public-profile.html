<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
  <title th:text="${profileUser.username} + 's Profil - DeckForge'">Profil</title>
  <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

<section th:insert="~{Parts/header :: header}"></section>

<main class="container">
  <div class="auth-wrapper">
    <div class="auth-box" style="max-width: 800px; padding: 40px;">

      <div style="text-align: center; border-bottom: 2px solid var(--primary-red); padding-bottom: 20px; margin-bottom: 30px;">
        <h1 th:if="${session.loggedInUser.userID == profileUser.userID}" style="color: var(--primary-red); margin: 0; text-shadow: var(--red-glow);">
          Din Profil
        </h1>

        <h1 th:unless="${session.loggedInUser.userID == profileUser.userID}" style="color: var(--text-white); margin: 0; text-shadow: var(--red-glow);">
          <span th:text="${profileUser.username}">Brugernavn</span>'s Profil
        </h1>

        <p style="color: var(--text-gray); margin-top: 10px; font-size: 1.1rem;" th:text="'DeckForge ' + ${profileUser.userRole}">Rolle</p>
      </div>

      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px;">

        <a th:href="@{/decks/{id}(id=${profileUser.userID})}" class="btn btn-outline" style="height: 100px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; border-color: var(--border-red);">
          Se Decks
        </a>

        <a th:href="@{/tradelist/{id}(id=${profileUser.userID})}" class="btn btn-outline" style="height: 100px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; border-color: var(--border-red);">
          Se Tradelist
        </a>

        <a th:href="@{/wishlist/{id}(id=${profileUser.userID})}" class="btn btn-outline" style="height: 100px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; border-color: var(--border-red);">
          Se Wishlist
        </a>

        <th:block th:if="${session.loggedInUser.userID == profileUser.userID}">
          <a th:href="@{/collectionPage}" class="btn btn-primary" style="height: 100px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; background-color: var(--primary-red);">
            Min Private Samling
          </a>
        </th:block>

      </div>

    </div>
  </div>
</main>

<section th:insert="~{Parts/footer :: footer}"></section>

</body>
</html>
