<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
  <title th:text="${profileUser.username} + 's Profil - DeckForge'">Profil</title>
  <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

<header th:replace="~{Parts/header :: header}"></header>

<main class="container">
  <section class="auth-wrapper profile-wrapper">
    <div class="auth-box profile-box" style="max-width: 800px;">

      <header style="text-align: center; border-bottom: 2px solid var(--primary-red); padding-bottom: 20px; margin-bottom: 30px;">
        <h1 th:if="${session.loggedInUser.userID == profileUser.userID}" style="color: var(--primary-red); margin: 0; text-shadow: var(--red-glow);">
          Din Profil
        </h1>

        <h1 th:unless="${session.loggedInUser.userID == profileUser.userID}" style="color: var(--text-white); margin: 0; text-shadow: var(--red-glow);">
          <span th:text="${profileUser.username}">Brugernavn</span>'s Profil
        </h1>

        <p class="text-gray mt-20" style="font-size: 1.1rem;" th:text="'DeckForge ' + ${profileUser.userRole}">Rolle</p>
      </header>

      <nav class="dashboard-grid">

        <a th:href="@{/decks/{id}(id=${profileUser.userID})}" class="btn btn-outline dashboard-column" style="height: 100px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem;">
          Se Decks
        </a>

        <a th:href="@{/tradelist/{id}(id=${profileUser.userID})}" class="btn btn-outline dashboard-column" style="height: 100px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem;">
          Se Tradelist
        </a>

        <a th:href="@{/wishlist/{id}(id=${profileUser.userID})}" class="btn btn-outline dashboard-column" style="height: 100px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem;">
          Se Wishlist
        </a>

        <th:block th:if="${session.loggedInUser.userID == profileUser.userID}">
          <a th:href="@{/collectionPage}" class="btn btn-primary dashboard-column" style="height: 100px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; box-shadow: var(--red-glow);">
            Min Private Samling
          </a>
        </th:block>

      </nav>

    </div>
  </section>
</main>

<footer th:replace="~{Parts/footer :: footer}"></footer>

</body>
</html>
