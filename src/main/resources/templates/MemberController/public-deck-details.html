<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
  <title th:text="${deck.deckName} + ' - DeckForge'">Deck Detaljer</title>
  <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

<header th:replace="~{Parts/header :: header}"></header>

<main class="container">
  <section class="auth-wrapper profile-wrapper">
    <div class="auth-box profile-box" style="max-width: 1000px;">

      <header class="profile-header">
        <div>
          <h1 th:text="${deck.deckName}" style="color: var(--text-white); margin: 0; text-shadow: var(--red-glow);">Deck Navn</h1>
          <p class="text-gray" style="margin: 5px 0 0 0; font-size: 1.1rem;">
            Format: <strong th:text="${deck.format.formatName}" style="color: var(--primary-red);">Format</strong> |
            Kort i alt: <strong th:text="${totalCardsInDeck}" style="color: var(--text-white);">0</strong>
          </p>
        </div>
        <a th:if="${deck.user != null}" th:href="@{/decks/{id}(id=${deck.user.userID})}" class="btn btn-outline btn-sm">Tilbage til Decks</a>
      </header>

      <aside th:if="${deck.commander != null}" style="background-color: rgba(255, 215, 0, 0.05); border: 1px solid rgba(255, 215, 0, 0.5); padding: 20px; border-radius: 4px; margin-bottom: 30px; text-align: center;">
        <h3 style="color: gold; margin: 0 0 10px 0; text-shadow: 0 0 10px rgba(255, 215, 0, 0.3);">♚ Commander ♚</h3>
        <h2 th:text="${deck.commander.cardName}" style="color: var(--text-white); margin: 0;">Commander Navn</h2>
        <p class="text-gray" style="font-size: 0.9rem; margin: 5px 0 0 0;" th:text="${deck.commander.cardType}">Type</p>
      </aside>

      <div th:if="${#lists.isEmpty(deck.deckItems)}" class="empty-state">
        <p class="empty-text">Dette deck indeholder ingen kort endnu.</p>
      </div>

      <section th:unless="${#lists.isEmpty(deck.deckItems)}" class="card-grid">

        <article th:each="item : ${deck.deckItems}" class="tcg-card" style="min-height: auto; position: relative;">

          <div style="position: absolute; top: -10px; right: -10px; background-color: var(--primary-red); color: white; width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; border: 2px solid var(--primary-red); box-shadow: var(--shadow);">
            <span th:text="${item.quantity}">1</span>
          </div>

          <header class="tcg-card-header" style="border-bottom: none; margin-top: 10px;">
            <span th:text="${item.card.cardName}">Kort Navn</span>
          </header>

          <div class="tcg-card-desc" style="margin-bottom: 0;">
            <p style="margin: 5px 0;" th:text="'Type: ' + ${item.card.cardType}">Type</p>
            <p style="margin: 5px 0;" th:text="'Farve: ' + ${item.card.colorIdentity}">Farve</p>
          </div>

        </article>

      </section>

    </div>
  </section>
</main>

<footer th:replace="~{Parts/footer :: footer}"></footer>

</body>
</html>
