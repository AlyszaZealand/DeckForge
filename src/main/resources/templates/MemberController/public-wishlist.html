<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${profileUser.username} + 's Ønskeliste - DeckForge'">Wishlist</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

<header th:replace="~{Parts/header :: header}"></header>

<main class="container">
    <section class="auth-wrapper profile-wrapper">
        <div class="auth-box profile-box">

            <header class="profile-header">
                <h1 style="margin: 0; color: var(--text-white);"><span th:text="${profileUser.username}">Bruger</span>'s Wishlist</h1>
                <a th:href="@{/profile/{id}(id=${profileUser.userID})}" class="btn btn-outline btn-sm">Tilbage til Profil</a>
            </header>

            <div th:if="${wishCollection == null or #lists.isEmpty(wishCollection?.wishCollectionItems)}" class="empty-state">
                <p class="empty-text">Denne bruger har i øjeblikket ingen kort i sin ønskeliste.</p>
            </div>

            <section th:unless="${wishCollection == null or #lists.isEmpty(wishCollection?.wishCollectionItems)}" class="card-grid">

                <article th:each="item : ${wishCollection?.wishCollectionItems}" class="tcg-card" style="min-height: auto;">
                    <header class="tcg-card-header">
                        <span th:text="${item.card.cardName}">Kort Navn</span>
                    </header>

                    <div class="tcg-card-desc" style="text-align: left;">
                        <p style="margin: 5px 0;" th:text="'Rarity: ' + ${item.card.cardRarity}">Rarity</p>
                        <p style="margin: 5px 0;" th:text="'Type: ' + ${item.card.cardType}">Type</p>
                    </div>

                    <div class="tcg-card-stats" style="border: none; padding-top: 0;">
                        <a th:href="@{/propose(receiverId=${profileUser.userID})}" class="btn btn-primary btn-block">
                            🤝 Tilbyd Bytte
                        </a>
                    </div>
                </article>

            </section>

        </div>
    </section>
</main>

<footer th:replace="~{Parts/footer :: footer}"></footer>

</body>
</html>
