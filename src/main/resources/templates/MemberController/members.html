<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Deck Forge - Members</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

<header th:replace="~{Parts/header :: header}"></header>

<main class="container">
    <section class="dashboard-grid">

        <article class="auth-box dashboard-column" style="flex: 2; padding: 30px;">
            <header class="profile-header" style="margin-bottom: 20px;">
                <h1 style="margin: 0; color: var(--text-white); text-shadow: var(--red-glow);">Medlemmer</h1>
                <span class="text-gray">Viser <strong th:text="${#lists.size(members)}">0</strong> spillere</span>
            </header>

            <div th:if="${members.isEmpty()}" class="empty-state">
                <p class="empty-text" style="font-size: 1.1rem;">Ingen medlemmer fundet med dette kort i deres Tradelist.</p>
                <a th:href="@{/members}" class="btn btn-outline mt-20">Vis alle medlemmer</a>
            </div>

            <div class="scrollable-container" style="max-height: 600px; padding: 10px; border: none; background: transparent;">
                <ul style="list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 15px;">
                    <li th:each="user : ${members}">
                        <a th:href="@{/profile/{id}(id=${user.userID})}" style="text-decoration: none;">
                            <div class="event-card card-primary" style="transition: transform 0.2s;">
                                <h3 th:text="${user.username}" style="margin: 0 0 5px 0; color: white;">Username</h3>
                                <span style="font-size: 0.85rem; color: var(--text-gray);">Klik for at se profil, Decks og Tradelist</span>
                            </div>
                        </a>
                    </li>
                </ul>
            </div>
        </article>

        <aside class="auth-box filter-box dashboard-column" style="flex: 1; height: fit-content;">
            <h3 style="border-bottom: 1px solid var(--primary-red); padding-bottom: 10px; margin-top: 0; color: var(--text-white);">Find Kort</h3>
            <p class="text-gray mb-20" style="font-size: 0.9rem;">Søg efter et specifikt kort for at finde medlemmer, der har det sat til bytte.</p>

            <form th:action="@{/members}" method="get">
                <div class="form-group">
                    <input type="text" name="searchCard" class="form-control" placeholder="F.eks. Black Lotus..." th:value="${searchCard}">
                </div>

                <button type="submit" class="btn btn-primary btn-block">Søg i Tradelists</button>

                <a th:if="${searchCard != null and !searchCard.isEmpty()}" th:href="@{/members}" class="btn btn-outline btn-block mt-10">Ryd Søgning</a>
            </form>
        </aside>

    </section>
</main>

<footer th:replace="~{Parts/footer :: footer}"></footer>

</body>
</html>
