<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Deck Forge - Events</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

<header th:replace="~{Parts/header :: header}"></header>

<main class="container">
    <header class="profile-header" style="align-items: center; flex-wrap: wrap; gap: 15px;">
        <h1 style="color: var(--primary-red); margin: 0;">Alle Events</h1>

        <a th:if="${session.loggedInUser != null and session.loggedInUser.userRole.name() == 'ORGANIZER'}"
           th:href="@{/registerEvent}" class="btn btn-primary">Opret Nyt Event</a>
    </header>

    <nav style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px;">
        <a th:href="@{/events(filter='future')}"
           th:classappend="${param.filter == null or param.filter[0] == 'future'} ? 'btn-primary' : 'btn-outline'"
           class="btn">Kommende Events</a>

        <a th:href="@{/events(filter='past')}"
           th:classappend="${param.filter != null and param.filter[0] == 'past'} ? 'btn-primary' : 'btn-outline'"
           class="btn">Tidligere Events</a>

        <a th:if="${session.loggedInUser != null and session.loggedInUser.userRole.name() == 'ORGANIZER'}"
           th:href="@{/events(filter='mine')}"
           th:classappend="${param.filter != null and param.filter[0] == 'mine'} ? 'btn-primary' : 'btn-outline'"
           class="btn">Mine Events</a>
    </nav>

    <div th:if="${events.isEmpty()}" class="empty-state">
        <p class="empty-text" style="font-size: 1.1rem; margin: 0;">Der blev ikke fundet nogen events i denne kategori.</p>
    </div>

    <section th:unless="${events.isEmpty()}" class="table-responsive">
        <table class="event-table">
            <thead>
            <tr>
                <th>Event Navn</th>
                <th>Status</th>
                <th>Dato</th>
                <th>Format</th>
                <th style="text-align: right;">Handling</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="event : ${events}">
                <td th:text="${event.eventName}" style="font-weight: bold;"></td>
                <td>
                    <span th:text="${event.eventStatus}"
                          th:style="${event.eventStatus.name() == 'CANCELLED' ? 'color: #ff4444; font-weight: bold;' : 'color: var(--text-gray);'}">Status</span>
                </td>
                <td th:text="${event.eventDate}" class="text-gray"></td>
                <td th:text="${event.eventFormat}" class="text-gray"></td>
                <td style="text-align: right;">
                    <a th:href="@{/events/{id}(id=${event.eventID})}" class="btn btn-outline btn-sm">Se Event</a>
                </td>
            </tr>
            </tbody>
        </table>
    </section>
</main>

<footer th:replace="~{Parts/footer :: footer}"></footer>

</body>
</html>
