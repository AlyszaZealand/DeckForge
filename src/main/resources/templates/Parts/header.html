<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

<header th:fragment="header" class="site-header">
    <div class="nav-container">

        <a th:href="@{/}" class="logo">
            <span class="logo-icon">♛</span> DECK<span>FORGE</span> <span class="logo-icon">♛</span>
        </a>

        <input type="checkbox" id="menu-toggle" class="menu-checkbox">

        <label for="menu-toggle" class="hamburger">
            <span class="hamburger-line"></span>
            <span class="hamburger-line"></span>
            <span class="hamburger-line"></span>
        </label>

        <nav class="main-nav">
            <ul class="nav-links">
                <li><a th:href="@{/}">Forside</a></li>

                <th:block th:if="${session.loggedInUser == null}">
                    <li><a th:href="@{/login}">Login</a></li>
                    <li><a th:href="@{/registerUser}">Register</a></li>
                </th:block>

                <th:block th:if="${session.loggedInUser != null}">
                    <li><a th:href="@{/profile}">Profil</a></li>
                    <li><a th:href="@{/collectionPage}">Collections</a></li>
                    <li><a th:href="@{/events}">Events</a></li>
                    <li><a th:href="@{/members}">Members</a></li>
                    <li><a th:href="@{/trades}">Trade</a></li>
                </th:block>

                <th:block th:if="${session.loggedInUser != null and session.loggedInUser.userRole.name() == 'ADMIN'}">
                    <li><a th:href="@{/createCard}" class="nav-special">Tilføj Kort</a></li>
                    <li><a th:href="@{/createFormat}" class="nav-special">Tilføj Format</a></li>
                </th:block>

                <th:block th:if="${session.loggedInUser != null and session.loggedInUser.userRole.name() == 'ORGANIZER'}">
                    <li><a th:href="@{/registerEvent}" class="nav-special">Tilføj Event</a></li>
                </th:block>

                <th:block th:if="${session.loggedInUser != null}">
                    <li class="logout-item">
                        <form th:action="@{/logout}" method="post" class="logout-form">
                            <button type="submit" class="btn btn-danger btn-sm">LOGOUT</button>
                        </form>
                    </li>
                </th:block>
            </ul>
        </nav>

    </div>
</header>

</body>
</html>
