<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<body>
<section th:fragment="header">
    <header>
        <div class="nav-container">

            <a th:href="@{/}" style="text-decoration: none;">
                <h2 style="color: var(--primary-red); margin: 0; display: flex; align-items: center; gap: 10px;">
                    <span>♛</span> DECK <span style="color: var(--text-white);">FORGE</span> <span>♛</span>
                </h2>
            </a>

            <nav>
                <ul class="nav-links">
                    <li><a th:href="@{/}">Forside</a></li>

                    <th:block th:if="${session.loggedInUser == null}">
                        <li><a th:href="@{/login}">Login</a></li>
                        <li><a th:href="@{/registerUser}">Register</a></li>
                    </th:block>

                    <th:block th:if="${session.loggedInUser != null}">
                        <li><a th:href="@{/profile}">Profil</a></li>
                        <li><a th:href="@{/collectionPage}">Collections</a></li>
                        <li><a th:href="@{/events}">Events</a></li>
                    </th:block>

                    <th:block th:if="${session.loggedInUser != null and session.loggedInUser.userRole.name() == 'ADMIN'}">
                        <li><a th:href="@{/addCard}" style="color: var(--text-gray);">Tilføj Kort</a></li>
                        <li><a th:href="@{/createFormat}" style="color: var(--text-gray);">Tilføj Format</a></li>
                    </th:block>

                    <th:block th:if="${session.loggedInUser != null and session.loggedInUser.userRole.name() == 'ORGANIZER'}">
                        <li><a th:href="@{/registerEvent}" style="color: var(--text-gray);">Tilføj Event</a></li>
                    </th:block>

                    <th:block th:if="${session.loggedInUser != null}">
                        <li style="display: flex; align-items: center;">
                            <form th:action="@{/logout}" method="post" style="margin: 0;">
                                <button type="submit" class="btn btn-danger" style="padding: 6px 12px; font-size: 0.8rem;">LOGOUT</button>
                            </form>
                        </li>
                    </th:block>
                </ul>
            </nav>
        </div>
