<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Deck Forge - Forside</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
<section th:replace="~{Parts/header :: header}"></section>
<main>
    <section class="hero-section">
        <h1>VELKOMMEN TIL <span>DECK FORGE</span></h1>
        <p>Smed dine strategier, saml de stærkeste kort, og dominer i de nyeste events.</p>
        <div class="hero-buttons">
            <a th:href="@{/collectionPage}" class="btn btn-primary">Gå til Samling</a>
            <a th:href="@{/myDecks}" class="btn btn-outline">Mine Decks</a>
        </div>
    </section>

    <section class="container">
        <h2 class="page-header">Kommende Events</h2>

        <div th:if="${events.isEmpty()}" class="empty-state">
            <p>Der er i øjeblikket ingen planlagte events.</p>
        </div>

        <div th:unless="${events.isEmpty()}" class="table-responsive">
            <table class="event-table">
                <thead>
                <tr>
                    <th>Event Navn</th>
                    <th>Dato</th>
                    <th>Format</th>
                    <th class="text-right">Handling</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="event : ${events}">
                    <td data-label="Event Navn" class="font-bold" th:text="${event.eventName}"></td>
                    <td data-label="Dato" class="text-gray" th:text="${event.eventDate}"></td>
                    <td data-label="Format" class="text-gray" th:text="${event.eventFormat}"></td>
                    <td data-label="Handling" class="text-right">
                        <a th:href="@{/events/{id}(id=${event.eventID})}" class="btn btn-outline btn-sm">Se Event</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>

<section th:replace="~{Parts/footer :: footer}"></section>
</body>
</html>
