<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<h1 style="text-align: center; color: rebeccapurple; font-size: 30px; margin-top: 10px;">Opret ny profil</h1>

<div th:if="${errorMessage}"
     style="background-color: #f8d7da; color: #721c24; padding: 10px; margin-bottom: 15px; border: 1px solid #f5c6cb; border-radius: 5px;"
     th:text="${errorMessage}">
</div>

<div class="form-container">
    <form action="/registerUser" method="post" th:object="${user}">

        <label>Navn:</label><br>
        <input type="text" th:field="*{username}"><br><br>

        <label>E-mail:</label><br>
        <input type="text" th:field="*{email}"><br><br>

        <label>Adgangskode:</label><br>
        <input type="password" name="password"><br><br>

        <button type="submit">Opret</button>
    </form>
    <button onclick="window.location.href='/login'" class="back-button" style="margin-top: 10px;">Gå til Login</button>
</div>

</body>
</html>
