<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opret Profil - Deck Forge</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
</head>
<body>

<header th:replace="~{Parts/header.html :: header}"></header>

<main>
    <section class="auth-wrapper">
        <article class="auth-box">

            <header>
                <h2 style="color: var(--primary-red);">OPRET PROFIL</h2>
                <p class="text-gray class mb-20">Bliv en del af smedjen og begynd din samling.</p>
            </header>

            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

            <form th:action="@{/registerUser}" method="post" th:object="${user}">
                <fieldset>
                    <div class="form-group">
                        <label>Navn:</label>
                        <input type="text" th:field="*{username}" class="form-control" placeholder="Dit brugernavn..." required>
                    </div>

                    <div class="form-group">
                        <label>E-mail:</label>
                        <input type="email" th:field="*{email}" class="form-control" placeholder="din@email.dk" required>
                    </div>

                    <div class="form-group">
                        <label>Adgangskode:</label>
                        <input type="password" name="password" class="form-control" placeholder="Vælg en stærk kode..." required>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block mt-20">Opret Profil</button>
                </fieldset>
            </form>

            <footer class="mt-20" style="text-align: center;">
                <p class="text-gray mb-20" style="font-size: 0.9rem;">Har du allerede en profil?</p>
                <a th:href="@{/login}" class="btn btn-outline btn-block">Gå til Login</a>
            </footer>

        </article>
    </section>
</main>

<footer th:replace="~{Parts/footer.html :: footer}"></footer>

</body>
</html>
