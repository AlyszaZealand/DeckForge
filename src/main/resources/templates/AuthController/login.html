<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login - Deck Forge</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
    <meta charset="UTF-8">
    <meta name="description" content="Login">
    <meta name="keywords" content="HTML, CSS, Login">
    <meta name="author" content="Bug Busters">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
<section th:insert="~{Parts/header.html :: header}"></section>

<main>
    <div class="auth-wrapper">
        <div class="auth-box">

            <h2 style="color: var(--primary-red);">LOGIN</h2>
            <p style="color: var(--text-gray); margin-bottom: 25px;">Velkommen tilbage til smedjen!</p>

            <div th:if="${errorMessage}"
                 style="background-color: rgba(255, 68, 68, 0.1); color: #ff4444; padding: 10px; margin-bottom: 20px; border: 1px solid #ff4444; border-radius: 4px; text-align: left;"
                 th:text="${errorMessage}">
            </div>

            <form th:action="@{/login}" method="post">

                <div class="form-group" style="text-align: left;">
                    <label>E-mail:</label>
                    <input type="email" name="email" class="form-control" placeholder="Indtast din email..." required>
                </div>

                <div class="form-group" style="text-align: left;">
                    <label>Adgangskode:</label>
                    <input type="password" name="password" class="form-control" placeholder="Indtast adgangskode..." required>
                </div>

                <button type="submit" class="btn btn-primary btn-block" style="margin-top: 20px;">Log ind</button>
            </form>

            <div style="margin-top: 15px;">
                <p style="color: var(--text-gray); font-size: 0.9rem; margin-bottom: 10px;">Ny bruger?</p>
                <a th:href="@{/registerUser}" class="btn btn-outline btn-block">Opret ny bruger</a>
            </div>

        </div>
    </div>
</main>

<section th:insert="~{Parts/footer.html :: footer}"></section>
</body>
</html>
