<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login - Deck Forge</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
    <meta charset="UTF-8">
    <meta name="description" content="Login">
    <meta name="keywords" content="HTML, CSS, Login">
    <meta name="author" content="Bug Busters">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
<header th:replace="~{Parts/header.html :: header}"></header>

<main>
    <section class="auth-wrapper">
        <article class="auth-box">

            <header>
                <h2 style="color: var(--primary-red);">LOGIN</h2>
                <p class="text-gray mb-20">Velkommen tilbage til smedjen!</p>
            </header>

            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

            <form th:action="@{/login}" method="post">
                <fieldset>
                    <div class="form-group">
                        <label>E-mail:</label>
                        <input type="email" name="email" class="form-control" placeholder="Indtast din email..." required>
                    </div>

                    <div class="form-group">
                        <label>Adgangskode:</label>
                        <input type="password" name="password" class="form-control" placeholder="Indtast adgangskode..." required>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block mt-20">Log ind</button>
                </fieldset>
            </form>

            <footer class="mt-20" style="text-align: center;">
                <p class="text-gray mb-20" style="font-size: 0.9rem;">Ny bruger?</p>
                <a th:href="@{/registerUser}" class="btn btn-outline btn-block">Opret ny bruger</a>
            </footer>

        </article>
    </section>
</main>

<footer th:replace="~{Parts/footer.html :: footer}"></footer>
</body>
</html>
