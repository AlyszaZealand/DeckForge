<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Deck Forge - Opret Kort</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

<header th:replace="~{Parts/header :: header}"></header>

<main class="container">
    <section class="auth-wrapper profile-wrapper">
        <article class="auth-box profile-box" style="max-width: 600px;">

            <header class="page-header" style="text-align: center; border-bottom: none; box-shadow: none;">
                <h1 style="margin: 0;">Opret Nyt Kort</h1>
            </header>

            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

            <form th:action="@{/createCard}" th:object="${card}" method="post">
                <fieldset>
                    <div class="form-group">
                        <label>Kortnavn</label>
                        <input type="text" class="form-control" th:field="*{cardName}" required placeholder="F.eks. Black Lotus">
                    </div>

                    <div class="form-group">
                        <label>Set / Udvidelse</label>
                        <input type="text" class="form-control" th:field="*{cardSet}" placeholder="F.eks. Alpha, Zendikar...">
                    </div>

                    <div class="filter-grid">
                        <div class="form-group">
                            <label>Farveidentitet</label>
                            <input type="text" class="form-control" th:field="*{colorIdentity}"
                                   pattern="^[WUBRGwubrg]+$|^Colorless$"
                                   title="Indtast kun W, U, B, R, G eller Colorless"
                                   placeholder="F.eks. WU eller Colorless" required>
                        </div>

                        <div class="form-group">
                            <label>Mana Cost</label>
                            <input type="text" class="form-control" th:field="*{manaCost}" placeholder="F.eks. 1UU">
                        </div>
                    </div>

                    <div class="filter-grid">
                        <div class="form-group">
                            <label>Korttype</label>
                            <select class="form-control" th:field="*{cardType}" required>
                                <option value="CREATURE">Creature</option>
                                <option value="ARTIFACT">Artifact</option>
                                <option value="ENCHANTMENT">Enchantment</option>
                                <option value="LAND">Land</option>
                                <option value="INSTANT">Instant</option>
                                <option value="SORCERY">Sorcery</option>
                                <option value="PLANESWALKER">Planeswalker</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Raritet</label>
                            <select class="form-control" th:field="*{cardRarity}" required>
                                <option value="COMMON">Common</option>
                                <option value="UNCOMMON">Uncommon</option>
                                <option value="RARE">Rare</option>
                                <option value="MYTHICRARE">Mythic Rare</option>
                            </select>
                        </div>
                    </div>

                    <div class="filter-grid">
                        <div class="form-group">
                            <label>Power</label>
                            <input type="number" class="form-control" th:field="*{power}">
                        </div>

                        <div class="form-group">
                            <label>Health / Toughness</label>
                            <input type="number" class="form-control" th:field="*{health}">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Beskrivelse / Effekter</label>
                        <textarea class="form-control" th:field="*{description}" rows="4" placeholder="Skriv kortets effekter her..."></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block mt-20">Opret Kort</button>
                    <a th:href="@{/}" class="btn btn-outline btn-block" style="margin-top: 10px;">Annuller / Tilbage</a>
                </fieldset>
            </form>

        </article>
    </section>
</main>

<footer th:replace="~{Parts/footer :: footer}"></footer>

</body>
</html>
