<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Deck Forge - Rediger Format</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

<section th:insert="~{Parts/header :: header}"></section>

<main class="container">
    <div class="auth-wrapper">
        <div class="auth-box" style="max-width: 600px;">

            <h1 class="page-header" style="text-align: center; border-bottom: none; box-shadow: none;">Rediger Format</h1>

            <div th:if="${errorMessage}"
                 style="background-color: rgba(179,0,0,0.2); border: 1px solid var(--primary-red); color: white; padding: 15px; margin-bottom: 20px; border-radius: 4px;">
                <ul style="margin-left: 20px;">
                    <li th:each="error : ${errorMessage}" th:text="${error}">Fejlbesked</li>
                </ul>
            </div>

            <form th:action="@{/updateFormat}" th:object="${format}" method="post">

                <input type="hidden" th:field="*{formatID}">

                <div class="form-group">
                    <label for="formatName">Formatnavn</label>
                    <input type="text" id="formatName" class="form-control" th:field="*{formatName}" required>
                </div>

                <div style="display: flex; gap: 15px;">
                    <div class="form-group" style="flex: 1;">
                        <label for="minDeckSize">Minimum kort i decket</label>
                        <input type="number" id="minDeckSize" class="form-control" th:field="*{minDeckSize}" required>
                    </div>

                    <div class="form-group" style="flex: 1;">
                        <label for="maxDeckSize">Maximum kort i decket</label>
                        <input type="number" id="maxDeckSize" class="form-control" th:field="*{maxDeckSize}" required>
                    </div>
                </div>

                <div style="display: flex; gap: 15px; align-items: flex-end;">
                    <div class="form-group" style="flex: 1;">
                        <label for="maxCopiesOfCard">Max antal kopier af samme kort</label>
                        <input type="number" id="maxCopiesOfCard" class="form-control" th:field="*{maxCopiesOfCard}" required>
                    </div>

                    <div class="form-group" style="flex: 1; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; height: 42px;">
                        <input type="checkbox" id="requiresCommander" th:field="*{requiresCommander}" style="width: 18px; height: 18px; cursor: pointer; accent-color: var(--primary-red);">
                        <label for="requiresCommander" style="margin-bottom: 0; cursor: pointer; color: var(--text-white);">Kræver en Commander?</label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="allowedRarities">Tilladte rariteter (kommasepareret)</label>
                    <input type="text" id="allowedRarities" class="form-control" th:field="*{allowedRarities}" placeholder="f.eks. ALL eller Common, Uncommon...">
                </div>

                <button type="submit" class="btn btn-primary btn-block" style="margin-top: 20px;">Gem Ændringer</button>
                <a th:href="@{/admin/formats}" class="btn btn-outline btn-block" style="margin-top: 10px;">Annuller / Tilbage</a>

            </form>
        </div>
    </div>
</main>

<section th:insert="~{Parts/footer :: footer}"></section>

</body>
</html>
