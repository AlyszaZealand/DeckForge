<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Deck Forge - Database Kort Katalog</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

<header th:replace="~{Parts/header :: header}"></header>

<main class="container" style="max-width: 1500px;">
    <header class="page-header">
        <h1 style="margin: 0; color: var(--primary-red);">Globalt Kort Katalog (Admin)</h1>
    </header>

    <form th:action="@{/admin/cards}" method="get" class="search-filter-box">
        <fieldset style="display: flex; flex-wrap: wrap; gap: 15px; align-items: flex-end; width: 100%; border: none; padding: 0; margin: 0;">
            <div class="form-group" style="margin-bottom: 0; flex: 1; min-width: 200px;">
                <label>Kortnavn</label>
                <input type="text" name="search" th:value="${currentSearch}" placeholder="Søg..." class="form-control">
            </div>

            <div class="form-group" style="margin-bottom: 0; flex: 1; min-width: 150px;">
                <label>Type</label>
                <select name="cardType" class="form-control">
                    <option value="">Alle</option>
                    <option th:each="enumType : ${T(feedback.deckforge.Model.Enum.CardType).values()}"
                            th:value="${enumType}" th:text="${enumType}"
                            th:selected="${currentCardType == enumType.name()}"></option>
                </select>
            </div>

            <div class="form-group" style="margin-bottom: 0; flex: 1; min-width: 150px;">
                <label>Raritet</label>
                <select name="rarity" class="form-control">
                    <option value="">Alle</option>
                    <option value="COMMON" th:selected="${currentRarity == 'COMMON'}">Common</option>
                    <option value="UNCOMMON" th:selected="${currentRarity == 'UNCOMMON'}">Uncommon</option>
                    <option value="RARE" th:selected="${currentRarity == 'RARE'}">Rare</option>
                    <option value="MYTHICRARE" th:selected="${currentRarity == 'MYTHICRARE'}">Mythic</option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary" style="height: 42px; min-width: 100px; flex-grow: 0;">Søg</button>
        </fieldset>
    </form>

    <section class="scrollable-container" style="max-height: 700px;">
        <div class="card-grid">
            <article class="tcg-card" th:each="card : ${searchResults}">
                <header class="tcg-card-header">
                    <span th:text="${card.cardName}">Kort Navn</span>
                    <span class="text-gray" style="font-size: 0.9em;" th:text="${card.manaCost}"></span>
                </header>

                <div class="tcg-card-type">
                    <span th:text="${card.cardType}"></span> - <span th:text="${card.cardRarity}"></span>
                </div>

                <div class="tcg-card-desc" th:text="${card.description}"></div>

                <footer style="margin-top: 15px;">
                    <form th:action="@{/admin/deleteCard}" method="post" onsubmit="return confirm('ADVARSEL: Sletning af dette kort fjerner det permanent fra hele databasen, alle brugeres samlinger samt alle decks! Vil du fortsætte?');">
                        <input type="hidden" name="cardID" th:value="${card.cardID}">
                        <button type="submit" class="btn btn-danger btn-block">Slet Kort Globalt</button>
                    </form>
                </footer>
            </article>
        </div>
    </section>
</main>

<footer th:replace="~{Parts/footer :: footer}"></footer>

</body>
</html>
